<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Dominik Paľo" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#10171c" />
    <script>
      (() => {
        let storedTheme = null;

        try {
          storedTheme = localStorage.getItem("palo-theme");
        } catch {
          // System preference is still available when browser storage is blocked.
        }

        const theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#10171c" : "#f5f7f6");
      })();
    </script>
